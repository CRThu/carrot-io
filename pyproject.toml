[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrot-io"
version = "1.7.0"
description = "A minimalist, zero-dependency, graceful-degradation hardware abstraction layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ftdi = ["pyftdi>=0.55.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "bump-my-version>=1.4.0"]
all = ["pyserial>=3.5", "pyftdi>=0.55.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["cio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "hardware: 标记需要真实物理硬件设备的集成测试",
    "loopback: 标记需要串口/网络回环短接线的硬件测试",
]

[tool.bumpversion]
current_version = "1.7.0"
commit = true
tag = true
allow_dirty = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} → {new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "cio/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
